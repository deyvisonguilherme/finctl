services:
  postgres:
    image: postgres:16-alpine
    container_name: finctl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: finctl
      POSTGRES_PASSWORD: finctl
      POSTGRES_DB: finctl
    ports:
      - "5432:5432"
    volumes:
      - finctl_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finctl -d finctl"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  finctl_pgdata:
